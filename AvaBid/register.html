<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvaBid - Регистрация</title>
    <link rel="icon" type="image/png" href="images/2.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-overlay">
        <div class="login-modal">
            
            <!-- Левая часть: Форма -->
            <div class="login-left">
                <!-- Кнопка закрытия (X) ведет назад на страницу входа -->
                <a href="login.html" class="close-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </a>

                <div class="login-header">
                    <img src="images/1.jpg" alt="AvaBid Logo" class="login-logo">
                    <h1>Впервые у нас?</h1>
                    <p>Зарегистрируйтесь, чтобы стать частью творческого мира</p>
                </div>

                <form class="login-form">
                    <div class="input-group">
                        <label for="reg-username">Имя пользователя</label>
                        <input type="text" id="reg-username" placeholder="">
                    </div>

                    <div class="input-group">
                        <label for="reg-email">Электронная почта</label>
                        <input type="email" id="reg-email" placeholder="">
                    </div>

                    <div class="input-group">
                        <label for="reg-password">Пароль</label>
                        <input type="password" id="reg-password" placeholder="">
                    </div>

                    <!-- Кнопка "Зарегистрироваться" ведет прямо в профиль -->
                    <a href="profile.html" class="login-btn" style="display: block; text-align: center; text-decoration: none; margin-top: 10px;">Зарегистрироваться</a>
                </form>
            </div>

            <!-- Правая часть: Картинка (задается через CSS) -->
            <div class="login-right"></div>

        </div>
    </div>

</body>
</html>
