<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvaBid - Вход</title>
    <link rel="icon" type="image/png" href="images/2.png">
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем шрифт Alegreya Sans SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-overlay">
        <div class="login-modal">
            
            <!-- Левая часть: Форма -->
            <div class="login-left">
                <!-- Кнопка закрытия (X) -->
                <a href="index.html" class="close-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </a>

                <div class="login-header">
                    <img src="images/2.png" alt="AvaBid Logo" class="login-logo">
                    <h1>Добро пожаловать!</h1>
                    <p>Войдите в своей аккаунт, чтобы продолжить и получить доступ ко всем возможностям платформы.</p>
                </div>

                <form class="login-form">
                    <div class="input-group">
                        <label for="username">Имя пользователя</label>
                        <input type="text" id="username" placeholder="">
                    </div>

                    <div class="input-group">
                        <div class="label-row">
                            <label for="password">Пароль</label>
                            <a href="recovery.html" class="forgot-link">Забыли пароль?</a>
                        </div>
                        <input type="password" id="password" placeholder="">
                    </div>

                   <a href="profile.html" class="login-btn" style="display: block; text-align: center; text-decoration: none;">Войти</a>
                </form>

                <div class="register-link">
                   Впервые у нас? <a href="register.html">Зарегистрируйтесь</a>
                </div>
            </div>

            <!-- Правая часть: Картинка (задается через CSS) -->
            <div class="login-right">
                 <img src="images/17a53499-85ef-4ffe-a290-c75537b7e4df 1.png" alt="Cute picture">
            </div>
        </div>
    </div>

</body>
</html>
